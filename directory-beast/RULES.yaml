# Directory Beast Orchestra Rules

## Model Routing
default: deepseek/deepseek-chat
coder: deepseek/deepseek-chat
product_owner: deepseek/deepseek-chat
reviewer: deepseek/deepseek-chat
researcher: deepseek/deepseek-chat
ceo: deepseek/deepseek-chat

## Budget Rules
daily_budget: 0.50  # USD per day
max_per_task: 0.10   # USD per individual task
alert_threshold: 0.40 # USD (alert when approaching daily limit)

## Token Efficiency
max_context_tokens: 4000
compact_every: 4000   # Compact memory every 4000 tokens
use_checkpoints: true
prefer_files_over_chat: true

## Role Definitions

### CEO (Captain)
- Oversees entire orchestra
- Makes strategic decisions
- Coordinates with other orchestras
- Reports to CEO Command Center
- Uses: default model

### Product Owner
- Defines product requirements
- Prioritizes features
- Validates user needs
- Manages backlog
- Uses: product_owner model

### Coder
- Implements features
- Brutally honest about debugging time
- Always reduces technical debt
- Documents code thoroughly
- Uses: coder model

### Reviewer
- Code reviews
- Quality assurance
- Performance testing
- Security checks
- Uses: reviewer model

### Researcher (NEW)
- Runs every 4 hours
- Scans Reddit/X/YouTube for trends
- Researches new tech stacks
- Identifies growth tactics
- Provides written recommendations to CEO
- Uses: researcher model

## Workflow Rules
parallel_coding: true
max_parallel_coders: 3
code_review_required: true
deployment_approval_required: true

## Cross-Orchestra Synergy Rules
# Every orchestra must check the shared knowledge base and other orchestras' progress every time it works.
# Actively look for synergy opportunities and share useful outputs with relevant other orchestras automatically.

## Specific Connections:
# → Social Beast: Automatically feeds listings/content ideas to Social Beast
# → KidScan Beast: Provides data for safety filtering and child-safe categorization
# → Nudge: Creates task templates from directory maintenance and updates
# → Affiliate Beast: Adds monetization opportunities to every directory listing
# → AppFactory Beast: Reuses directory components and patterns

## Shared Knowledge Base
knowledge_base_path: ../knowledge/orchestras
shared_knowledge_base: ../SHARED_KNOWLEDGE_BASE.md
memory_sync_interval: 3600  # Sync every hour
cross_orchestra_learning: true
cross_orchestra_check_required: true  # Must check other orchestras before starting work

## Security Rules
no_external_posting: true
no_real_money_transactions: true
ask_before_external_actions: true
respect_rate_limits: true

## Communication
ceo_command_center: true
daily_sync_time: "20:00 HKT"
weekly_retrospective: "Sunday 20:00 HKT"

## Quality Standards
apple_level_design: true
type_safe: true
test_coverage_minimum: 70%
documentation_required: true

## Escalation Protocol
1. Coder stuck > 30 minutes → ask Product Owner
2. Product Owner stuck > 1 hour → ask CEO
3. CEO stuck > 2 hours → ask CEO Command Center
4. Budget approaching limit → pause and alert
5. Critical error → immediate alert
