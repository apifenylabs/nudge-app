  <!-- Orbiting dots -->
  <circle cx="100" cy="45" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="155" cy="100" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="100" cy="155" r="3" fill="#F9A8D4" opacity="0.6"/>
  <circle cx="45" cy="100" r="3" fill="#F9A8D4" opacity="0.6"/>
