  </defs>
  <!-- Outer glow rings -->
  <circle cx="100" cy="100" r="85" fill="url(#ow-s)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#F9A8D4" stroke-width="0.8" opacity="0.3"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#F9A8D4" stroke-width="0.5" opacity="0.2"/>
