  <ellipse cx="115" cy="92" rx="9" ry="10" fill="white"/>
  <ellipse cx="87" cy="93" rx="4.5" ry="5" fill="#2E1065"/>
  <ellipse cx="117" cy="93" rx="4.5" ry="5" fill="#2E1065"/>
