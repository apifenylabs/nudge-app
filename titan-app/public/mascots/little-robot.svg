<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="lr-g" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
  </defs>
  <!-- Antenna -->
  <line x1="100" y1="50" x2="100" y2="28" stroke="#0891B2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="25" r="6" fill="#22D3EE"/>
  <!-- Head -->
  <rect x="58" y="50" width="84" height="60" rx="12" fill="url(#lr-g)"/>
  <!-- Eyes -->
  <circle cx="80" cy="75" r="12" fill="white"/>
  <circle cx="120" cy="75" r="12" fill="white"/>
  <circle cx="82" cy="76" r="6" fill="#0F172A"/>
  <circle cx="122" cy="76" r="6" fill="#0F172A"/>
  <circle cx="80" cy="72" r="3" fill="white" opacity="0.6"/>
  <circle cx="120" cy="72" r="3" fill="white" opacity="0.6"/>
  <!-- Mouth grid -->
  <rect x="85" y="90" width="30" height="10" rx="3" fill="#0F172A" opacity="0.3"/>
  <line x1="92" y1="90" x2="92" y2="100" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="100" y2="100" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="108" y1="90" x2="108" y2="100" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="68" y="115" width="64" height="45" rx="8" fill="url(#lr-g)" opacity="0.8"/>
  <!-- Buttons -->
  <circle cx="85" cy="130" r="4" fill="#F59E0B"/>
  <circle cx="100" cy="130" r="4" fill="#14B8A6"/>
  <circle cx="115" cy="130" r="4" fill="#EF4444"/>
  <!-- Arms -->
  <rect x="42" y="120" width="18" height="8" rx="4" fill="#0891B2"/>
  <rect x="140" y="120" width="18" height="8" rx="4" fill="#0891B2"/>
</svg>
