<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="aegis-g" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="40%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>
    <radialGradient id="aegis-s" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FBCFE8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aegis-i" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </radialGradient>
  </defs>
  <!-- Soft aura / guard glow -->
  <circle cx="100" cy="100" r="75" fill="url(#aegis-s)"/>
  <!-- Body (round, soft, Kirby-like puffball) -->
  <ellipse cx="100" cy="108" rx="48" ry="48" fill="url(#aegis-g)"/>
  <!-- Stubby feet -->
  <ellipse cx="80" cy="155" rx="14" ry="8" fill="#DB2777"/>
  <ellipse cx="120" cy="155" rx="14" ry="8" fill="#DB2777"/>
  <!-- Inner face patch -->
  <ellipse cx="100" cy="100" rx="28" ry="24" fill="url(#aegis-i)"/>
  <!-- Big eyes -->
  <ellipse cx="84" cy="92" rx="10" ry="12" fill="#831843"/>
  <ellipse cx="116" cy="92" rx="10" ry="12" fill="#831843"/>
  <ellipse cx="82" cy="88" rx="4" ry="4" fill="white" opacity="0.8"/>
  <ellipse cx="114" cy="88" rx="4" ry="4" fill="white" opacity="0.8"/>
  <!-- Cheerful mouth -->
  <path d="M88 106 Q100 118 112 106" fill="none" stroke="#831843" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="72" cy="100" rx="8" ry="4" fill="#FBCFE8" opacity="0.6"/>
  <ellipse cx="128" cy="100" rx="8" ry="4" fill="#FBCFE8" opacity="0.6"/>
  <!-- Tiny shield icon (on side) -->
  <g transform="translate(145, 120)">
    <path d="M0 0 L12 0 L12 15 L6 18 L0 15 Z" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5"/>
    <path d="M4 6 L8 6" stroke="#DB2777" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 4 L6 10" stroke="#DB2777" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Star particles -->
  <g opacity="0.4">
    <circle cx="50" cy="80" r="2.5" fill="#F9A8D4"/>
    <circle cx="155" cy="75" r="2" fill="#F9A8D4"/>
    <circle cx="55" cy="130" r="2" fill="#F9A8D4"/>
    <circle cx="148" cy="145" r="2.5" fill="#F9A8D4"/>
  </g>
</svg>