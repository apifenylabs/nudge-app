<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="pixel-g" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <radialGradient id="pixel-w" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </radialGradient>
    <radialGradient id="pixel-h" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
  </defs>
  <!-- Mushroom cap (Toad-style head) -->
  <path d="M40 100 Q40 35 100 30 Q160 35 160 100 Z" fill="url(#pixel-g)"/>
  <!-- Spots on cap -->
  <circle cx="95" cy="55" r="8" fill="white" opacity="0.85"/>
  <circle cx="125" cy="70" r="6" fill="white" opacity="0.85"/>
  <circle cx="70" cy="75" r="5" fill="white" opacity="0.85"/>
  <circle cx="110" cy="48" r="5" fill="white" opacity="0.85"/>
  <circle cx="138" cy="55" r="4" fill="white" opacity="0.85"/>
  <circle cx="60" cy="58" r="4" fill="white" opacity="0.85"/>
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="40" ry="30" fill="url(#pixel-w)"/>
  <!-- Big round eyes -->
  <circle cx="82" cy="102" r="12" fill="#075985"/>
  <circle cx="118" cy="102" r="12" fill="#075985"/>
  <circle cx="79" cy="98" r="5" fill="white" opacity="0.9"/>
  <circle cx="115" cy="98" r="5" fill="white" opacity="0.9"/>
  <!-- Happy smile -->
  <path d="M85 120 Q100 132 115 120" fill="none" stroke="#075985" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="70" cy="112" rx="7" ry="4" fill="#BAE6FD" opacity="0.4"/>
  <ellipse cx="130" cy="112" rx="7" ry="4" fill="#BAE6FD" opacity="0.4"/>
  <!-- Tiny wrench / tool -->
  <g transform="translate(25, 135)">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="9" y="8" width="3" height="12" rx="1" fill="#0EA5E9"/>
    <rect x="8" y="18" width="5" height="4" rx="1" fill="#0EA5E9"/>
  </g>
  <!-- Sparkle particles -->
  <g opacity="0.6">
    <path d="M155 60 L157 55 L159 60 L164 62 L159 64 L157 69 L155 64 L150 62 Z" fill="#FDE047"/>
    <path d="M45 45 L46.5 41 L48 45 L52 46.5 L48 48 L46.5 52 L45 48 L41 46.5 Z" fill="#FDE047"/>
  </g>
  <!-- Little feet -->
  <ellipse cx="80" cy="138" rx="14" ry="7" fill="#0284C7"/>
  <ellipse cx="120" cy="138" rx="14" ry="7" fill="#0284C7"/>
</svg>