<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="spark-g" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
    <radialGradient id="spark-b" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark-c" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
  </defs>
  <!-- Electric aura -->
  <circle cx="100" cy="95" r="80" fill="url(#spark-b)"/>
  <!-- Body -->
  <ellipse cx="100" cy="105" rx="42" ry="45" fill="url(#spark-g)"/>
  <!-- Lightning bolt tail -->
  <path d="M130 125 L150 150 L140 150 L155 175 L120 145 L130 145 L110 125 Z" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
  <!-- Ears (pointed, Pikachu-like) -->
  <path d="M65 80 L55 40 L80 70" fill="url(#spark-g)" stroke="#EAB308" stroke-width="1"/>
  <path d="M135 80 L145 40 L120 70" fill="url(#spark-g)" stroke="#EAB308" stroke-width="1"/>
  <path d="M68 75 L60 48 L78 68" fill="#FEF08A" opacity="0.4"/>
  <path d="M132 75 L140 48 L122 68" fill="#FEF08A" opacity="0.4"/>
  <!-- Face -->
  <ellipse cx="100" cy="98" rx="30" ry="25" fill="#FDE047" opacity="0.3"/>
  <!-- Eyes (big, expressive) -->
  <ellipse cx="80" cy="88" rx="12" ry="14" fill="white"/>
  <ellipse cx="120" cy="88" rx="12" ry="14" fill="white"/>
  <ellipse cx="82" cy="90" rx="7" ry="8" fill="#292524"/>
  <ellipse cx="122" cy="90" rx="7" ry="8" fill="#292524"/>
  <ellipse cx="80" cy="85" rx="3" ry="3" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="85" rx="3" ry="3" fill="white" opacity="0.8"/>
  <!-- Blush marks -->
  <ellipse cx="68" cy="100" rx="8" ry="4" fill="#FCA5A5" opacity="0.35"/>
  <ellipse cx="132" cy="100" rx="8" ry="4" fill="#FCA5A5" opacity="0.35"/>
  <!-- Mouth (happy) -->
  <path d="M90 104 Q100 114 110 104" fill="none" stroke="#854D0E" stroke-width="2" stroke-linecap="round"/>
  <!-- Static sparks around body -->
  <g opacity="0.6">
    <path d="M45 100 L40 90 L46 95" fill="#FDE047" stroke="#FACC15" stroke-width="0.5"/>
    <path d="M155 85 L160 75 L154 80" fill="#FDE047" stroke="#FACC15" stroke-width="0.5"/>
    <path d="M60 140 L54 135 L58 142" fill="#FDE047" stroke="#FACC15" stroke-width="0.5"/>
    <path d="M150 120 L156 115 L152 122" fill="#FDE047" stroke="#FACC15" stroke-width="0.5"/>
  </g>
</svg>