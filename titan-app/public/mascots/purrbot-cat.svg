  <ellipse cx="80" cy="95" rx="11" ry="12" fill="white"/>
  <ellipse cx="120" cy="95" rx="11" ry="12" fill="white"/>
  <ellipse cx="82" cy="96" rx="5.5" ry="6" fill="#0F172A"/>
  <ellipse cx="122" cy="96" rx="5.5" ry="6" fill="#0F172A"/>
