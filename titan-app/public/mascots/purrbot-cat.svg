<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="pc-g" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <polygon points="55,95 65,45 85,85" fill="url(#pc-g)"/>
  <polygon points="145,95 135,45 115,85" fill="url(#pc-g)"/>
  <polygon points="58,88 67,55 82,82" fill="#EDE9FE" opacity="0.5"/>
  <polygon points="142,88 133,55 118,82" fill="#EDE9FE" opacity="0.5"/>
