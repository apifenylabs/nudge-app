  <circle cx="80" cy="95" r="8" fill="none" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="120" cy="95" r="8" fill="none" stroke="#6D28D9" stroke-width="0.5" opacity="0.3"/>
