  <line x1="65" y1="105" x2="40" y2="102" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
  <line x1="65" y1="110" x2="38" y2="112" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="105" x2="160" y2="102" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="110" x2="162" y2="112" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
