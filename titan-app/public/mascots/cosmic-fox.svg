<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cf-g" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <polygon points="55,85 70,35 90,75" fill="url(#cf-g)"/>
  <polygon points="145,85 130,35 110,75" fill="url(#cf-g)"/>
  <polygon points="60,78 72,45 87,72" fill="#FED7AA" opacity="0.5"/>
  <polygon points="140,78 128,45 113,72" fill="#FED7AA" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="100" cy="100" rx="52" ry="48" fill="url(#cf-g)"/>
  <!-- Face markings -->
  <ellipse cx="100" cy="115" rx="22" ry="14" fill="#FED7AA" opacity="0.6"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="90" rx="10" ry="11" fill="white"/>
  <ellipse cx="120" cy="90" rx="10" ry="11" fill="white"/>
  <ellipse cx="82" cy="91" rx="5" ry="6" fill="#0F172A"/>
  <ellipse cx="122" cy="91" rx="5" ry="6" fill="#0F172A"/>
  <ellipse cx="80" cy="87" rx="2.5" ry="2.5" fill="white" opacity="0.6"/>
  <ellipse cx="120" cy="87" rx="2.5" ry="2.5" fill="white" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="100" cy="104" rx="5" ry="3.5" fill="#0F172A"/>
  <!-- Smile -->
  <path d="M90 110 Q100 120 110 110" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M150 130 Q180 100 165 145" stroke="#C2410C" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="165" cy="145" r="6" fill="#FED7AA"/>
