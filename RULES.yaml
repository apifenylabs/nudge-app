# ═══════════════════════════════════════════════════════════════
# AUTO-SPAWN PARALLEL WORK ENGINE (LOCKED May 4 2026)
# ═══════════════════════════════════════════════════════════════
parallel_work:
  enabled: true
  framework: "subagent-sessions"
  rules:
    max_parallel_sessions: 3
    ram_guard:
      enabled: true
      command: "free -m | awk 'NR==2{print $7}'"
      min_free_mb: 1536  # 1.5 GB minimum free RAM before spawning
      action_below_min: "run_in_current_session_only — do NOT spawn sub-agents"

    spawn_condition:
      description: "Only spawn sub-agents when a task has 2+ truly independent subtasks"
      examples:
        valid: "Deploy site A AND improve site B — independent"
        invalid: "Write code AND review same code — dependent, do sequentially"
      check: "Can subtask B run without waiting for subtask A's output?"

    worker_config:
      mode: "run"  # one-shot, not persistent
      runtime: "subagent"
      model: "deepseek/deepseek-chat"  # cheapest effective
      thinking: null
      light_context: true
      timeout_seconds:
        normal: 600  # 10 min — P0/P1/P2/P4 tasks
        expand: 1800  # 30 min — P3 EXPAND (new dirs, migrations, large content)

    lifecycle:
      solo_rule: "Do NOT spawn sub-agents if you have a spawned session already active"
      check_before_spawn: "Run `subagents list` — if count >= 3, skip spawning"
      recovery: "If a sub-agent doesn't complete in 10 minutes, assume failure, record error, continue without it"
      no_orphans: "After spawning, write PIDs/session info to work-engine-state.md under backgroundPIDs"

# ═══════════════════════════════════════════════════════════════
# DEPLOYMENT PIPELINE
# ═══════════════════════════════════════════════════════════════
deployment_pipeline:
  mandatory: true
  steps:
    - step: "Product Owner"
      deliverable: "BRD + PRD with acceptance criteria"
    - step: "Coder"
      deliverable: "Implementation"
    - step: "UI Agent"
      deliverable: "Design review"
    - step: "Tester"
      deliverable: "Test execution report"
    - step: "SEO Agent"
      deliverable: "SEO optimization"
    - step: "Security Agent"
      deliverable: "Security audit report"
    - step: "Reviewer"
      deliverable: "Code quality review"
    - step: "Chief Editor + CTO"
      deliverable: "Final sign-off"
      model: "anthropic/claude-sonnet-4-6"
      escalation: "anthropic/claude-opus-4-6 (requires approval)"
    - step: "Deploy"
      deliverable: "Production release"

# ═══════════════════════════════════════════════════════════════
# ORCHESTRA MONITORING
# ═══════════════════════════════════════════════════════════════
orchestra_monitoring:
  watchdog_enabled: true
  schedule: "*/5 * * * *"
  task: |
    cd /home/captain/.openclaw/workspace
    RUNNING=$(pm2 jlist | jq '[.[] | .pm2_env.status] | contains(["online"])' )
    if [ "$RUNNING" != "true" ]; then
      echo "Orchestras down. Restarting..."
      pm2 resurrect 2>/dev/null || pm2 start pm2-ecosystem.config.js
    fi
  alert_threshold: 2
  auto_restart: true
  health_check_endpoints:
    - directory_beast: "http://localhost:3000/health"
  required_orchestras: 2
  max_restart_attempts: 3
  escalation_channel: "telegram:1741426794"

