# ══════════════════════════════════════════════════════════════════════════
# DAILY CAPACITY ALLOCATION
# ══════════════════════════════════════════════════════════════════════════
#
# Every work session (cron, heartbeat, manual instruction):
#   1. Check work-engine-state.md cursor
#   2. If revenue bucket has open items → 70% effort there
#   3. Always allocate at least 30% to strategic projects
#   4. If revenue bucket is empty → 100% to strategic projects
#   5. NEVER respond HEARTBEAT_OK if strategic projects have work to do
#   6. Always push a backlog item forward — even if it's just one task

# ══════════════════════════════════════════════════════════════════════════
# IDEA REVIEW PIPELINE
# ══════════════════════════════════════════════════════════════════════════
#
# Before any new project is created:
#   1. Does it fit in Revenue or Strategic bucket?
#   2. If Revenue: does it have a clear monetization path within 30 days?
#   3. If Strategic: does the CEO explicitly approve it?
#   4. If neither: REJECT — route to idea backlog in life/Projects/
#
# New ideas are logged to life/Projects/IDEA_BACKLOG.md for periodic review.
# No new standalone project repos without passing this pipeline.

