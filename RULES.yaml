# ═══════════════════════════════════════════════════════════════
# LLM & RAM MANAGEMENT (LOCKED May 17 2026)
# ═══════════════════════════════════════════════════════════════
# 32GB RAM awareness — CEO agent checks RAM before choosing models.

llm_ram_management:
  locked: true
  lock_date: "2026-05-17"
  enabled: true
  total_ram_gb: 32
  check_command: "free -m"
  resource_aware_decision_tree:
    step_1_easy_tasks:
      condition: "Easy / repetitive / formatting / simple data work / basic writing / file operations / regex / data cleanup"
      ram_check:
        min_free_mb: 2048
        action_if_low: "Use ollama:llama3.2 (lightest, 2GB model) first. Skip heavier local models."
      action: "Ollama local — priority by quality"
      priority_order:
        - "ollama:qwen3-coder:latest (1.9GB — best local coder)"
        - "ollama:gemma4:latest (3.3GB — fastest for light tasks)"
        - "ollama:deepseek-r1:latest (4.7GB — local reasoning)"
        - "ollama:llama3.2:latest (2.0GB — lightest fallback)"
      on_error: "Fallback to next local model. NEVER try cloud for easy tasks."
      ram_note: "At <2GB free, skip qwen3-coder and deepseek-r1 (too large). Use gemma4 or llama3.2 only."
    
    step_2_research:
      condition: "RESEARCH / trend scanning / data gathering / competitor analysis"
      action: "Gemini 2.5 Flash (free tier)"
      model: "google/gemini-2.5-flash-preview"
      on_error: "Fallback to ollama:gemma4 + web_search. Do NOT cascade to DeepSeek/Sonnet/Opus for research."
    
    step_3_normal_work:
      condition: "80%+ of work — coding, writing, SEO, product, testing, playbooks, content, configurations"
      action: "DeepSeek-chat cloud (default workhorse)"
      model: "deepseek/deepseek-chat"
      parallel_option: "Coder2 = ollama:qwen3-coder:latest (if RAM >4GB free)"
    
    step_4_complex_reasoning:
      condition: "Complex / high-stakes / final review after 2 failed attempts with DeepSeek"
      steps:
        - "Attempt 1: deepseek/deepseek-chat"
        - "Attempt 2: deepseek/deepseek-v4-flash (fallback)"
        - "Attempt 3 (only after 2 failures OR explicit need): anthropic/claude-sonnet-4-6"
      on_error: "Do NOT cascade to Opus without human approval"
    
    step_5_production:
      condition: "Production deployment / portfolio decision / final sign-off"
      model: "anthropic/claude-opus-4-6"
      requirement: "Explicit human approval from Chris REQUIRED before using"

