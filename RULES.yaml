# ═══════════════════════════════════════════════════════════════
# RULES.yaml — STRICT LLM ROUTING + AUTONOMY (LOCKED May 5 2026)
# ═══════════════════════════════════════════════════════════════
# DO NOT MODIFY without explicit human approval from Wosobu.
# This is the FINAL, ZERO-AMBIGUITY, ZERO-GUESSING routing strategy.
# FAILURE TO FOLLOW THESE RULES EXACTLY = SYSTEM DOWNTIME = UNACCEPTABLE.
# All agents MUST follow the decision tree exactly, every single time.

# ═══════════════════════════════════════════════════════════════
# STRICT LLM HIERARCHY — Source of Truth (LOCKED May 5 2026)
# ═══════════════════════════════════════════════════════════════
# Kid analogy:
#   - Easy (2+2 math) → Ollama local (fastest available)
#   - Research → Gemini 2.5 Flash (free tier) ONLY, else Ollama
#   - 80%+ of work (coding, writing, product) → DeepSeek-chat
#   - Very high-stakes review → DeepSeek first, then Sonnet (only after 2 failures)
#   - Final production approval → Opus ONLY with human approval
#
# CRITICAL RULES (NEVER BREAK):
#   1. phi3:latest is an OLLAMA LOCAL MODEL, NOT a DeepSeek cloud model.
#      All local models must be prefixed with "ollama:" to prevent cloud routing.
#   2. If Gemini returns ANY error (429, quota, timeout) → IMMEDIATELY fallback to Ollama.
#      Do NOT retry Gemini, do NOT cascade to Claude.
#   3. Never attempt Claude Sonnet/Opus unless step 4 or step 5 conditions are explicitly met.
#   4. On ANY model error → immediately try next safe model, do NOT stall or retry same model.
#   5. Default/Safe model is DeepSeek-chat for everything except simple local tasks and research.
#
# CRITICAL LESSON FROM MAY 4 DISASTER:
#   Gemini free tier exhausted → phi3 misrouted to cloud DeepSeek API → auth cooldown blocked
#   DeepSeek-chat → Anthropic billing blocked → ALL MODELS FAILED.
#   Root causes: (1) local models sent to cloud, (2) fallback chain put DeepSeek-chat too late,
#   (3) no hard separation between local and cloud routing.
#   FIXED: prefix all local models with ollama:, separate cloud and local fallback chains.
# ═══════════════════════════════════════════════════════════════

model_routing:
  aliases:
    # ─── LOCAL OLLAMA MODELS (prefix ollama: = route to localhost:11434, NEVER cloud) ───
    ollama_primary: "ollama:qwen3-coder:latest"    # Best local coder (pull in progress)
    ollama_gemma4: "ollama:gemma4:latest"           # Fastest for light tasks
    ollama_deepseek_local: "ollama:deepseek-r1:latest"  # Local reasoning
    ollama_medium: "ollama:llama3.2:latest"         # 2GB — lightest fallback, confirmed working

    # ─── CLOUD MODELS ───
    gemini_research: "google/gemini-2.5-flash-preview"  # Research free tier
    deepseek: "deepseek/deepseek-chat"                  # Main workhorse (quality + consistency)
    deepseek_fallback: "deepseek/deepseek-v4-flash"     # Cheap DeepSeek alternative
    sonnet: "anthropic/claude-sonnet-4-6"               # ONLY for step 4 escalation
    opus: "anthropic/claude-opus-4-6"                   # ONLY for step 5 + human approval

  # ─── STRICT DECISION TREE (follow exactly every time, zero guessing allowed) ───
  decision_tree:
    step_1:
      condition: "EASY / repetitive / formatting / simple data work / basic writing / file operations"
      meaning: "File renames, simple transformations, basic formatting, repetitive tasks, simple drafts, regex, data cleanup, file ops"
      action: "Ollama local — priority by quality"
      model: "ollama:qwen3-coder:latest"          # Primary: best local coder
      secondary_model: "ollama:gemma4:latest"       # Secondary: fastest light tasks
      tertiary_model: "ollama:deepseek-r1:latest"   # Tertiary: local reasoning
      quaternary_model: "ollama:llama3.2:latest"    # Lightest fallback
      on_error: "Immediately fallback to next local model in priority order. NEVER try cloud for easy tasks."
      local_only: true

    step_2:
      condition: "RESEARCH / trend scanning / data gathering / competitor analysis / Google Trends / Reddit scanning"
      meaning: "Google Trends, Reddit scanning, competitor research, trend analysis, daily news, market research"
      action: "Gemini 2.5 Flash (free tier) ONLY"
      model: "google/gemini-2.5-flash-preview"
      on_error:
        error_types: ["429", "rate_limit", "quota", "RESOURCE_EXHAUSTED", "any"]
        action: "IMMEDIATELY fallback to Ollama local + web_search tool. Do NOT retry Gemini. Do NOT cascade to Claude."
        fallback_model: "ollama:gemma4:latest"
        fallback_tool: "web_search"
      never_retry_on: "Gemini 429 or quota errors — assume free tier exhausted for the day, move on immediately"

    step_3:
      condition: "NORMAL WORK — coding / writing / SEO / Product Owner / UI Agent / Tester / Hype-Man / daily agent work"
      meaning: "80%+ of all work. Code generation, content writing, SEO, product decisions, UI, tests, reviews, distribution. This is the main workhorse for quality and consistency."
      action: "DeepSeek-chat (cloud) — quality first, cost-conscious"
      model: "deepseek/deepseek-chat"
      secondary: "DeepSeek local or Qwen3-Coder local"
      secondary_condition: "Use local first when possible to save cost, but ONLY if quality is not compromised. For quality-critical work, always prefer DeepSeek-chat cloud."
      preferred_local: "ollama:qwen3-coder:latest"
      parallel_coding:
        description: "When multiple coders are needed in parallel"
        coder1_main: "deepseek/deepseek-chat (cloud)"
        coder2_second_opinion: "ollama:qwen3-coder:latest"
        condition: "Only spawn parallel coders when tasks are truly independent"
      on_deepseek_error:
        - error: "429 / rate_limit"
          action: "Wait 30s and retry once. If still fails, use ollama:qwen3-coder:latest for this turn."
        - error: "400 / format / auth"
          action: "Immediately try ollama:qwen3-coder:latest. Do NOT cascade to Claude for format errors."
        - error: "billing / quota"
          action: "Immediately use ollama:qwen3-coder:latest. Do NOT cascade to Claude for billing issues."

    step_4:
      condition: "Final code review / complex reasoning / high-stakes decision / production audit"
      meaning: "Production deployment review, architecture decision, budget > $10, security audit, critical bugs"
      action: "DeepSeek-chat first"
      model: "deepseek/deepseek-chat"
      escalation: "anthropic/claude-sonnet-4-6"
      escalation_condition: "ONLY after DeepSeek has tried twice on the SAME task AND failed, OR the task involves budget > $10 or security"
      max_attempts_before_escalation: 2
      skip_escalation: "If task is normal coding or routine review, do NOT escalate to Sonnet — DeepSeek suffices"

    step_5:
      condition: "Final production deployment approval / major strategic repositioning"
      meaning: "End of MVP, planning next phase, big portfolio decision, going live to production"
      action: "Claude Opus 4.6 — ONLY after explicit human approval"
      model: "anthropic/claude-opus-4-6"
      requires_human_approval: true
      approval_message: "Ask Wosobu: 'This requires Claude Opus for production-level decision. Approve? Budget impact: $X'"
      never_auto_call: "Opus is NEVER automatically called. Human must say yes first."

  # ─── PER-ROLE MODEL ASSIGNMENT ───
  # Every role has: primary + backup + escalation + strict rules
  role_routing:
    ceo_orchestrator:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      easy: "ollama:llama3.2:latest"
      escalation: "deepseek/deepseek-chat (retry) — only escalate to Sonnet after 2 failures + step 4 condition"
      final_signoff: "anthropic/claude-opus-4-6 (requires human approval)"
      description: "Captain — orchestrates entire system"

    product_owner:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "PRDs, backlog, feature decisions"

    coder:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:qwen3-coder:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "All code — use local when possible to save cost"

    writer:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "Blog posts, content, copywriting"

    seo_agent:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "SEO optimization, metadata, structured data"

    ui_agent:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:qwen3-coder:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "UI components, Tailwind, design"

    tester_qa:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "Test cases, QA, test execution"

    first_reviewer:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      escalation: "deepseek/deepseek-chat (retry)"
      description: "First-pass code/content review — DeepSeek suffices for 99% of reviews"

    researcher:
      primary: "google/gemini-2.5-flash-preview"
      gemini_offline_fallback: "ollama:llama3.2:latest + web_search"
      backup_local: "ollama:llama3.2:latest"
      escalation: "deepseek/deepseek-chat"
      description: "Trend scanning, market research — if Gemini fails (429/quota), use Ollama + web search immediately"

    hype_man_distribution:
      primary: "deepseek/deepseek-chat"
      backup_local: "ollama:llama3.2:latest"
      local_for_simple: true
      escalation: "deepseek/deepseek-chat (retry)"
      description: "Social content, build-in-public, distribution"

    security_agent:
      primary: "deepseek/deepseek-chat"
      escalation: "deepseek/deepseek-chat (retry) then anthropic/claude-sonnet-4-6"
      description: "Security audits — Sonnet only for critical findings"

    final_reviewer:
      primary: "deepseek/deepseek-chat"
      escalation: "anthropic/claude-sonnet-4-6"
      requires_human_approval_for_escalation: false
      description: "Final review before production deployment — DeepSeek first, Sonnet only if DeepSeek identifies issues"

    chief_editor_cto:
      primary: "deepseek/deepseek-chat"
      escalation: "anthropic/claude-sonnet-4-6"
      final_signoff: "anthropic/claude-opus-4-6 (requires human approval)"
      requires_human_approval_for_opus: true
      description: "Final sign-off before deployment — Sonnet for review, Opus only with human OK"

  # ─── SAFE FALLBACK CHAINS (FIXED May 5 — absolute separation of local vs cloud) ───
  # Previous bug: phi3:latest was routed to DeepSeek cloud API, causing auth cooldown
  # that blocked DeepSeek-chat. Now: all local models are prefixed with ollama: and
  # cloud fallback chain is separate from local fallback chain.
  fallback_chain:
    # For standard / coding / writing tasks:
    cloud_primary:
      - "deepseek/deepseek-chat"            # Step 1: main workhorse
      - "deepseek/deepseek-v4-flash"         # Step 2: cheap DeepSeek alternative
      - "ollama:llama3.2:latest"             # Step 3: local fallback (no auth needed, no cooldown)
      - "anthropic/claude-sonnet-4-6"        # Step 4: ONLY if step 4 conditions met
      - "anthropic/claude-opus-4-6"          # Step 5: ONLY with human approval

    # For simple / easy tasks (priority order by quality):
    easy_tasks_local:
      - "ollama:qwen3-coder:latest"          # 1st: best local coder
      - "ollama:gemma4:latest"                # 2nd: fastest light tasks
      - "ollama:deepseek-r1:latest"           # 3rd: local reasoning
      - "ollama:llama3.2:latest"              # 4th: lightest fallback

    # For research tasks:
    research_fallback:
      - "google/gemini-2.5-flash-preview"    # Try Gemini first
      - "ollama:llama3.2:latest"             # IMMEDIATELY to local on any Gemini error
      - "deepseek/deepseek-chat"             # Only if local also fails (rare)

  # ─── CRITICAL: LOCAL MODEL ROUTING RULE (NEVER send local models to cloud APIs) ───
  local_model_prefixes:
    - "ollama:"   # All models prefixed with ollama: route to localhost:11434, NEVER to cloud

  # ─── STRICT ERROR HANDLING (LOCKED May 5 — never stall or cascade-fail again) ───
  strict_error_handling:
    on_any_error:
      action: "Immediately attempt next model in the appropriate fallback_chain. Do NOT stall, do NOT retry the same failing model more than once."
      max_retries_same_model: 1
    specific_errors:
      "429":
        action: "Provider quota exhausted for this period. Skip ALL models from this provider for the current turn."
      "400":
        action: "Model name invalid or misconfigured. Skip this exact model, try next in chain."
      "billing":
        action: "Provider billing issue. Skip ALL models from this provider until human fixes billing."
      "timeout":
        action: "Skip to next model in chain. Log the timeout for review."

  # ─── OLLAMA LOCAL LLM CONFIG ───
  use_local_llm: true
  local_ollama_server: "http://localhost:11434"
  local_timeout_seconds: 60
  local_models:
    primary: "qwen3-coder"                   # Best local coder (pull in progress)
    gemma4: "gemma4"                          # Fastest for light tasks
    deepseek_local: "deepseek-r1"             # Local reasoning
    lightest: "llama3.2:latest"              # 2GB — confirmed working ✅

