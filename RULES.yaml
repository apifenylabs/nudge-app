# ══════════════════════════════════════════════════════════════════════════
# BALANCED PRIORITIZATION (LOCKED)
# ══════════════════════════════════════════════════════════════════════════
#
# 70% of all work capacity must go to direct revenue-generating tasks
# this week (affiliates, PDF playbooks, monetization improvements).
#
# 30% of capacity is reserved for Founder Strategic Projects (explicitly
# protected — never starved, never deprioritized to zero):
#   1. LifeOS (personality-aware copilot)
#   2. AI Directory (apifeny-ai)
#   3. Titan (visual/gamified agent builder like Replit + Solo Leveling)
#
# The CEO must always find work to do in the Strategic Projects bucket
# every day — never say "nothing to do" or "HEARTBEAT_OK" if there's
# high-priority work pending.
#
# Never create new projects outside these buckets without passing the
# full Revenue-First + Idea Review Pipeline.
#
# When the system idles (all P0-P4 items done), it MUST:
#   a) Pick highest-impact task from the 3 Strategic Projects
#   b) If none obvious, improve LifeOS plugin depth (more categories, connected features)
#   c) If nothing, improve Titan (progression, UI polish, Supabase connection)
#   d) If nothing, improve AI Directory (content, SEO, affiliate integration)
#   e) If truly nothing anywhere, generate a backlog entry in work-engine-state.md

# ══════════════════════════════════════════════════════════════════════════
# PROJECT CLASSIFICATION
# ══════════════════════════════════════════════════════════════════════════

