<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LifeOS — Daily Loop</title>
<script>window.__SUPABASE_READY=!1;window.__SUPABASE=null;(function(){var u=window.LIFEOS_SUPABASE_URL||document.querySelector('meta[name="lifeos-supabase-url"]')?.content||'';var k=window.LIFEOS_SUPABASE_ANON_KEY||document.querySelector('meta[name="lifeos-supabase-key"]')?.content||'';if(!u||!k){console.log('LifeOS: offline mode (no Supabase env vars)');return}var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.crossOrigin='anonymous';s.onload=function(){try{window.__SUPABASE=window.supabase.createClient(u,k);window.__SUPABASE_READY=!0;console.log('LifeOS: Supabase sync enabled')}catch(e){console.log('LifeOS: Supabase init failed, offline fallback')}};s.onerror=function(){console.log('LifeOS: Supabase CDN load failed, offline fallback')};document.head.appendChild(s)})()</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F172A;color:#E2E8F0;min-height:100vh;padding:0 0 32px}
.container{max-width:480px;margin:0 auto;padding:16px}
header{padding:20px 0 12px}
h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;color:#F1F5F9}
.streak{font-size:13px;color:#14B8A6;background:rgba(20,184,166,0.12);padding:4px 12px;border-radius:20px;font-weight:600}
.date{font-size:13px;color:#94A3B8;margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;border:1px solid #334155;background:transparent;color:#94A3B8;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
.tab:hover{background:#1E293B;color:#E2E8F0}
.tab.active{background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;border-color:#14B8A6}
.tab-dot{display:none;width:6px;height:6px;border-radius:50%;margin-left:4px;vertical-align:middle}
.tab-dot.show{display:inline-block}.tab-dot.has-data{background:#F59E0B}
.card{background:#1E293B;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #334155}
.card h2{font-size:14px;font-weight:600;margin-bottom:10px;color:#CBD5E1}
.plugin-section{display:none}.plugin-section.active{display:block}
.track-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155}
.track-item:last-child{border-bottom:none}
.track-label{font-size:14px;font-weight:500;color:#E2E8F0}
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:20px;border:1px solid #334155;background:#1E293B;color:#94A3B8;font-size:12px;cursor:pointer;transition:all .15s;font-weight:500;flex-shrink:0}
.btn:hover{background:#334155;color:#E2E8F0}
.btn.active{background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;border-color:#14B8A6}
.btn.active.bad{background:linear-gradient(135deg,#EF4444,#DC2626);border-color:#EF4444}
.btn.active.mid{background:linear-gradient(135deg,#F59E0B,#D97706);border-color:#F59E0B}
.notes-area{width:100%;border:1px solid #334155;border-radius:10px;padding:10px;font-size:13px;resize:vertical;min-height:60px;font-family:inherit;background:#0F172A;color:#E2E8F0}
.notes-area:focus{outline:none;border-color:#14B8A6}
.notes-area::placeholder{color:#64748B}
.journal-area{width:100%;border:1px solid #334155;border-radius:10px;padding:12px;font-size:14px;resize:vertical;min-height:180px;font-family:inherit;background:#0F172A;color:#E2E8F0;line-height:1.6}
.journal-area:focus{outline:none;border-color:#14B8A6}
.journal-area::placeholder{color:#64748B}
.journal-entry{border-left:2px solid #14B8A6;padding:10px 14px;background:rgba(20,184,166,0.05);border-radius:0 8px 8px 0;margin:8px 0;white-space:pre-wrap;font-size:13px;line-height:1.5;color:#94A3B8}
.habit-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #334155;cursor:pointer}
.habit-item:last-child{border-bottom:none}
.habit-checkbox{width:20px;height:20px;border-radius:50%;border:2px solid #475569;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.habit-checkbox.checked{background:linear-gradient(135deg,#14B8A6,#0D9488);border-color:#14B8A6}
.habit-checkbox.checked::after{content:'\2713';color:white;font-size:12px;font-weight:700}
.habit-name{flex:1;font-size:13px;color:#E2E8F0}
.habit-streak{font-size:11px;color:#14B8A6;font-weight:500}
.save-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
.save-btn:hover{opacity:.9}.save-btn:disabled{opacity:.4;cursor:default}
.sync-btn{width:100%;padding:10px;border:1px solid #334155;border-radius:10px;background:transparent;color:#94A3B8;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;transition:all .15s}
.sync-btn:hover{background:#1E293B;color:#E2E8F0}
.history{margin-top:20px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;font-size:12px;color:#94A3B8}
.history-score{font-weight:600}.day-good{color:#14B8A6}.day-ok{color:#F59E0B}.day-bad{color:#EF4444}
.empty{text-align:center;padding:40px 0;color:#475569;font-size:14px}
.trend-bar{height:8px;background:#334155;border-radius:4px;overflow:hidden}
.trend-fill{height:100%;border-radius:4px;transition:width .3s}
.notif{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22C55E;color:white;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.notif.error{background:#EF4444}.notif.show{opacity:1}
.plugin-title{font-size:13px;color:#64748B;padding:4px 0;margin-bottom:4px}
</style>
</head>
<body>
<div class="container">
<div id="notif" class="notif"></div>
<header>
<div style="display:flex;justify-content:space-between;align-items:center">
<h1>LifeOS <span class="streak" id="streak">0 days</span></h1>
</div>
<div class="date" id="date"></div>
</header>
<div class="tabs" id="tabs"></div>
<!-- DAILY TRACKER -->
<div class="plugin-section active" id="sec-daily">
<div class="card" id="trackers"><h2>How was today?</h2><div id="tracker-list"></div></div>
<div class="card"><h2>Notes / Reflect</h2><textarea class="notes-area" id="notes" placeholder="What went well? What to improve?" maxlength="1000"></textarea></div>
<button class="save-btn" id="saveBtn" disabled>Save Today</button>
<div style="display:flex;gap:6px;margin-top:6px"><button class="sync-btn" id="syncBtn">Sync All History</button></div>
<span id="syncStatus" style="display:block;text-align:center;font-size:11px;color:#475569;margin-top:4px"></span>
<div class="history" id="history"><h2 style="font-size:14px;font-weight:600;color:#CBD5E1;margin-bottom:8px">Last 7 Days</h2><div id="history-list"></div></div>
<div class="card" id="trends"><h2>Trend (7-day avg)</h2><div id="trends-list" style="display:flex;flex-direction:column;gap:8px"></div></div>
</div>
<div id="plugin-sections"></div>
</div>
<script>
const PLUGIN_MANIFEST=[
{id:'daily',name:'Daily Tracker',emoji:'',desc:'Your main daily dashboard',fields:['sleep','mood','energy','exercise','food','focus','social','productivity','learning','mindfulness','finances'],isBuiltIn:true},
{id:'wellbeing',name:'Wellbeing',emoji:'🧘',desc:'Sleep, mood, energy & mindfulness',fields:['sleep','mood','energy','mindfulness']},
{id:'fitness',name:'Fitness',emoji:'🏃',desc:'Exercise & nutrition',fields:['exercise','food']},
{id:'productivity',name:'Productivity',emoji:'🎯',desc:'Focus & productivity',fields:['focus','productivity']},
{id:'social',name:'Social',emoji:'🤝',desc:'Social connections',fields:['social']},
{id:'learning',name:'Learning',emoji:'📚',desc:'Learning & growth',fields:['learning']},
{id:'finance',name:'Finance',emoji:'💰',desc:'Finances & spending',fields:['finances']},
{id:'journal',name:'Journal',emoji:'\u270d\ufe0f',desc:'Free-form daily journal',fields:[],isPlugin:true},
{id:'habits',name:'Habits',emoji:'\u2705',desc:'Daily habit checklist',fields:[],isPlugin:true}
];
const TRACKERS=[
{id:'sleep',label:'😴 Sleep',options:[{v:1,l:'<6h'},{v:2,l:'6-7h'},{v:3,l:'7-8h'},{v:4,l:'8+'}],def:2},
{id:'mood',label:'😊 Mood',options:[{v:1,l:'Bad'},{v:2,l:'Meh'},{v:3,l:'Good'},{v:4,l:'Great'}],def:2},
{id:'energy',label:'\u26a1 Energy',options:[{v:1,l:'Low'},{v:2,l:'OK'},{v:3,l:'High'},{v:4,l:'Max'}],def:2},
{id:'exercise',label:'🏃 Exercise',options:[{v:0,l:'None'},{v:1,l:'Light'},{v:2,l:'Good'},{v:3,l:'Intense'}],def:0},
{id:'food',label:'🥗 Nutrition',options:[{v:0,l:'Junk'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Perfect'}],def:1},
{id:'focus',label:'🎯 Focus',options:[{v:0,l:'Scattered'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Deep'}],def:1},
{id:'social',label:'🤝 Social',options:[{v:0,l:'Alone'},{v:1,l:'Minimal'},{v:2,l:'Connected'},{v:3,l:'Great'}],def:1},
{id:'productivity',label:'💼 Productivity',options:[{v:0,l:'Wasted'},{v:1,l:'Low'},{v:2,l:'Focused'},{v:3,l:'Flow'}],def:1},
{id:'learning',label:'📚 Learning',options:[{v:0,l:'None'},{v:1,l:'Light'},{v:2,l:'Read'},{v:3,l:'Studied'}],def:0},
{id:'mindfulness',label:'🧘 Mindfulness',options:[{v:0,l:'None'},{v:1,l:'Brief'},{v:2,l:'Meditated'},{v:3,l:'Deep'}],def:0},
{id:'finances',label:'💰 Finances',options:[{v:0,l:'Overspent'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Saved'}],def:1}
];
const DEFAULT_HABITS=[
{id:'h1',label:'Drink 8 glasses of water'},
{id:'h2',label:'Read for 15+ minutes'},
{id:'h3',label:'Walk 5,000+ steps'},
{id:'h4',label:'No screens 1h before bed'},
{id:'h5',label:'Plan tomorrow'}
];
function getToday(){return new Date().toISOString().split('T')[0]}
function getDateStr(){const d=new Date();return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'})}
function loadData(){try{return JSON.parse(localStorage.getItem('lifeos')||'{}')}catch{return{}}}
function saveData(d){localStorage.setItem('lifeos',JSON.stringify(d));render()}
function getScore(e){if(!e)return 0;let t=0;TRACKERS.forEach(tk=>{const v=e[tk.id]||0;t+=v});return Math.round(t/TRACKERS.length*25)}
function yesterday(t,i){const d=new Date(t);d.setDate(d.getDate()-1-i);return d.toISOString().split('T')[0]}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getStreak(data){const days=Object.keys(data.days||{}).sort().reverse();if(!days.length)return 0;let streak=0;const t=getToday();for(const d of days){if(d===t||streak>0||d===yesterday(t,streak)){streak++}else if(streak===0)break}return streak}
function waitForSupabase(m){if(m===void 0)m=1e4;return new Promise(function(r){var w=0;function c(){if(window.__SUPABASE_READY&&window.__SUPABASE)return r(window.__SUPABASE);w+=100;if(w>=m)return r(null);setTimeout(c,100)}if(window.__SUPABASE_READY&&window.__SUPABASE)return r(window.__SUPABASE);setTimeout(c,100)})}
function buildSyncPayload(ds,entry){var s=JSON.parse(JSON.stringify(entry||{}));return{id:'daily-'+ds,user_id:'demo',category:'daily_tracker',name:ds,emoji:'',state:s,total_actions:1,overall_progress:getScore(entry),last_active_at:new Date().toISOString()}}
function syncToSupabase(ds,entry){if(!window.__SUPABASE_READY||!window.__SUPABASE)return;window.__SUPABASE.from('lifeos_plugins').upsert(buildSyncPayload(ds,entry),{onConflict:'id'}).then(function(r){if(r.error)console.warn('sync fail',r.error)}).catch(function(){})}
function tryLoadFromSupabase(ds){if(!window.__SUPABASE_READY||!window.__SUPABASE)return Promise.resolve(null);return window.__SUPABASE.from('lifeos_plugins').select('state').eq('id','daily-'+ds).single().then(function(r){if(r.error||!r.data||!r.data.state)return null;return r.data.state}).catch(function(){return null})}
const today=getToday();let currentTab='daily';
function getCV(){const d=loadData();const e=d.days?.[today]||{};const v={};TRACKERS.forEach(t=>{v[t.id]=e[t.id]!==void 0?e[t.id]:t.def});return{data:d,entry:e,vals:v}}
function notify(msg,e){const el=document.getElementById('notif');el.textContent=msg;el.className='notif show'+(e?' error':'');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500)}
function render(){const{data,entry,vals}=getCV();const te=document.getElementById('tabs');te.innerHTML='';PLUGIN_MANIFEST.forEach(p=>{const b=document.createElement('button');b.className='tab'+(p.id===currentTab?' active':'');b.textContent=p.emoji+' '+p.name;if(p.id==='daily'){const d=document.createElement('span');d.className='tab-dot';if(data.days&&Object.keys(data.days).length>0)d.classList.add('show','has-data');b.appendChild(d)}b.onclick=()=>switchTab(p.id);te.appendChild(b)});document.getElementById('date').textContent=getDateStr();document.getElementById('streak').textContent='🔥 '+getStreak(data)+' day'+(getStreak(data)!==1?'s':'');if(currentTab==='daily')renderDaily(data,entry,vals);renderPS(data,entry,vals)}
function renderDaily(data,entry,vals){const list=document.getElementById('tracker-list');list.innerHTML='';TRACKERS.forEach(tk=>{const val=vals[tk.id];const div=document.createElement('div');div.className='track-item';div.innerHTML='<div><div class="track-label">'+tk.label+'</div></div><div class="btn-group"></div>';const bd=div.querySelector('.btn-group');tk.options.forEach(o=>{const b=document.createElement('button');b.className='btn'+(o.v===val?' active':'');if(tk.id==='mood'&&o.v===1&&o.v===val)b.classList.add('bad');if(tk.id==='mood'&&o.v===2&&o.v===val)b.classList.add('mid');b.textContent=o.l;b.onclick=()=>{setVal(tk.id,o.v);render()};bd.appendChild(b)});list.appendChild(div)});document.getElementById('notes').value=entry.notes||'';const sn=entry.notes||'',cn=document.getElementById('notes').value;const tc=TRACKERS.some(tk=>vals[tk.id]!==(entry[tk.id]!==void 0?entry[tk.id]:tk.def));const nc=cn!==sn;document.getElementById('saveBtn').disabled=!(tc||nc);document.getElementById('saveBtn').textContent=(tc||nc)?'Save Today':'Saved';const hl=document.getElementById('history-list');const days=Object.keys(data.days||{}).sort().reverse().slice(0,7);if(!days.length){hl.innerHTML='<div class="empty">No days tracked yet. Start today!</div>'}else{hl.innerHTML='';days.forEach(d=>{const e=data.days[d];const sc=getScore(e);const dt=new Date(d+'T12:00:00');const lb=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const di=document.createElement('div');di.className='history-item';di.innerHTML='<span>'+lb+'</span><span class="history-score '+(sc>=80?'day-good':sc>=50?'day-ok':'day-bad')+'">'+sc+'%</span>';hl.appendChild(di)})}const tl=document.getElementById('trends-list');const td=Object.keys(data.days||{}).sort().reverse().slice(0,7);if(td.length>0){tl.innerHTML='';TRACKERS.forEach(tk=>{const v2=td.map(d=>data.days[d][tk.id]).filter(v=>v!==void 0&&v!==null);if(!v2.length)return;const avg=v2.reduce((a,b)=>a+b,0)/v2.length;const max=tk.options.reduce((m,o)=>o.v>m?o.v:m,0);const pct=avg>0?Math.round((avg/max)*100):0;const di=document.createElement('div');di.className='track-item';di.style.padding='4px 0';di.innerHTML='<span style="font-size:12px;width:120px;flex-shrink:0;color:#94A3B8">'+tk.label+'</span><div class="trend-bar" style="flex:1"><div class="trend-fill" style="width:'+pct+'%;background:'+(pct>=75?'#14B8A6':pct>=50?'#F59E0B':'#EF4444')+'"></div></div><span style="font-size:11px;color:#64748B;width:30px;text-align:right">'+avg.toFixed(1)+'</span>';tl.appendChild(di)})}else{tl.innerHTML='<div class="empty">Track a few days to see trends</div>'}}
function setVal(id,v){const d=loadData();if(!d.days)d.days={};if(!d.days[today])d.days[today]={};d.days[today][id]=v;saveData(d)}
function switchTab(t){currentTab=t;document.querySelectorAll('.plugin-section').forEach(e=>e.classList.remove('active'));const g=document.getElementById('sec-'+t);if(g)g.classList.add('active');render()}
function renderPS(data,entry,vals){const c=document.getElementById('plugin-sections');c.innerHTML='';PLUGIN_MANIFEST.forEach(p=>{if(p.isBuiltIn)return;const sec=document.createElement('div');sec.className='plugin-section'+(currentTab===p.id?' active':'');sec.id='sec-'+p.id;if(p.fields&&p.fields.length>0){sec.innerHTML='<div class="card"><h2>'+p.emoji+' '+p.name+'</h2><div id="tlist-'+p.id+'"></div></div>';const tl=sec.querySelector('#tlist-'+p.id);p.fields.forEach(fid=>{const tk=TRACKERS.find(t=>t.id===fid);if(!tk)return;const val=vals[tk.id];const di=document.createElement('div');di.className='track-item';di.innerHTML='<div><div class="track-label">'+tk.label+'</div></div><div class="btn-group"></div>';const bd=di.querySelector('.btn-group');tk.options.forEach(o=>{const b=document.createElement('button');b.className='btn'+(o.v===val?' active':'');if(tk.id==='mood'&&o.v===1&&o.v===val)b.classList.add('bad');if(tk.id==='mood'&&o.v===2&&o.v===val)b.classList.add('mid');b.textContent=o.l;b.onclick=()=>{setVal(tk.id,o.v);render()};bd.appendChild(b)});tl.appendChild(di)})}if(p.id==='journal')buildJournal(sec,data);if(p.id==='habits')buildHabits(sec,data);c.appendChild(sec)})}
function buildJournal(sec,data){const te=data.days?.[today]||{};sec.innerHTML='<div class="card"><h2>Journal</h2><div class="plugin-title">Write freely about your day</div><textarea class="journal-area" id="journal-area" placeholder="What happened today? How do you feel? Any insights or memories to capture?" maxlength="5000"></textarea><div style="margin-top:10px;display:flex;gap:6px;align-items:center"><button class="save-btn" id="journal-save" style="width:auto;padding:10px 20px">Save Entry</button><span id="journal-status" style="font-size:12px;color:#64748B"></span></div><div style="margin-top:12px"><h2 style="font-size:13px;color:#94A3B8;margin-bottom:6px">Recent Entries</h2><div id="journal-history"></div></div></div>';const a=document.getElementById('journal-area');a.value=te.journal||'';const jh=document.getElementById('journal-history');const ds=Object.keys(data.days||{}).sort().reverse().slice(0,14);const es=ds.filter(d=>data.days[d]&&data.days[d].journal&&data.days[d].journal.trim());if(!es.length){jh.innerHTML='<div class="empty" style="padding:16px 0">No journal entries yet</div>'}else{jh.innerHTML='';es.slice(0,7).forEach(d=>{const txt=data.days[d].journal;const dt=new Date(d+'T12:00:00');const lb=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});const di=document.createElement('div');di.innerHTML='<div style="font-size:11px;color:#64748B;margin-bottom:2px">'+lb+'</div><div class="journal-entry">'+escHtml(txt.slice(0,200))+(txt.length>200?'...':'')+'</div>';jh.appendChild(di)})}document.getElementById('journal-save').onclick=()=>{const d=loadData();if(!d.days)d.days={};if(!d.days[today])d.days[today]={};d.days[today].journal=a.value;saveData(d);document.getElementById('journal-status').textContent='Saved '+new Date().toLocaleTimeString();notify('Journal saved')}}
function calcHabitStreak(data,hid){const ds=Object.keys(data.days||{}).sort().reverse();let streak=0;const t=getToday();for(const d of ds){const h=data.habits&&data.habits[d];const done=h&&h[hid]===true;if(d===t||streak>0||d===yesterday(t,streak)){if(done)streak++;else{if(streak===0)continue;break}}else if(streak===0)break}return streak}
function buildHabits(sec,data){const th=data.habits&&data.habits[today]?JSON.parse(JSON.stringify(data.habits[today])):{};sec.innerHTML='<div class="card"><h2>Daily Habits</h2><div class="plugin-title">Check off your daily habits</div><div id="habit-list"></div><div style="margin-top:12px;display:flex;gap:6px;align-items:center"><button class="save-btn" id="habits-save" style="width:auto;padding:10px 20px">Save Habits</button><span id="habits-status" style="font-size:12px;color:#64748B"></span></div><div style="margin-top:12px;padding:10px;background:#0F172A;border-radius:10px;border:1px solid #334155"><div style="font-size:12px;color:#94A3B8;margin-bottom:8px;font-weight:600">Habit Streaks</div><div id="habit-streaks"></div></div></div>';const hl=document.getElementById('habit-list');DEFAULT_HABITS.forEach(h=>{const c=th[h.id]===true;const sk=calcHabitStreak(data,h.id);const di=document.createElement('div');di.className='habit-item';di.innerHTML='<div class="habit-checkbox'+(c?' checked':'')+'"></div><span class="habit-name">'+h.label+'</span><span class="habit-streak">🔥 '+sk+'</span>';di.onclick=()=>{const d=loadData();if(!d.habits)d.habits={};if(!d.habits[today])d.habits[today]={};d.habits[today][h.id]=!d.habits[today][h.id];saveData(d)};hl.appendChild(di)});const sc=document.getElementById('habit-streaks');sc.innerHTML='';DEFAULT_HABITS.forEach(h=>{const sk=calcHabitStreak(data,h.id);const di=document.createElement('div');di.style.cssText='display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #334155';di.innerHTML='<span style="color:#94A3B8">'+h.label+'</span><span style="color:#14B8A6;font-weight:600">'+sk+' day'+(sk!==1?'s':'')+'</span>';sc.appendChild(di)});document.getElementById('habits-save').onclick=()=>{notify('Habits saved!')}}
document.getElementById('date').textContent=getDateStr();
document.getElementById('saveBtn').onclick=()=>{const d=loadData();if(!d.days)d.days={};var e=Object.assign({},getCV().vals,{notes:document.getElementById('notes').value});d.days[today]=e;saveData(d);syncToSupabase(today,e);notify('Saved')};
document.getElementById('notes').oninput=()=>{const d=loadData();const te=d.days?.[today]||{};document.getElementById('saveBtn').disabled=document.getElementById('notes').value===(te.notes||'')};
document.getElementById('syncBtn').onclick=function(){var btn=this;var st=document.getElementById('syncStatus');btn.disabled=true;btn.textContent='Syncing...';st.textContent='Connecting...';waitForSupabase().then(function(sb){if(!sb){st.textContent='No Supabase connection';btn.disabled=false;btn.textContent='Sync All History';return}var d=loadData();var days=Object.keys(d.days||{});if(!days.length){st.textContent='No data to sync';btn.disabled=false;btn.textContent='Sync All History';return}var i=0;function n(){if(i>=days.length){st.textContent='Synced '+days.length+' day(s)';btn.disabled=false;btn.textContent='Sync All History';return}var dd=days[i];var entry=d.days[dd];sb.from('lifeos_plugins').upsert(buildSyncPayload(dd,entry),{onConflict:'id'}).then(function(r){if(r.error)console.warn('sync error',dd,r.error);i++;st.textContent='Syncing '+i+'/'+days.length+'...';n()}).catch(function(){i++;n()})}n()})};
waitForSupabase().then(function(sb){if(!sb)return;tryLoadFromSupabase(today).then(function(rs){if(!rs)return;var d=loadData();if(!d.days)d.days={};var lo=d.days[today];var hl=lo&&Object.keys(lo).length>0&&TRACKERS.some(function(tk){return lo[tk.id]!==void 0});if(!hl){var m=Object.assign({},rs);TRACKERS.forEach(function(tk){if(m[tk.id]===void 0||m[tk.id]===null)m[tk.id]=tk.def});d.days[today]=m;saveData(d)}})});
render();
</script>
