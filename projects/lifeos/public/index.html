<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LifeOS — Daily Loop</title>
<!-- Supabase SDK (loaded lazily, only if env vars present) -->
<script>window.__SUPABASE_READY=!1;window.__SUPABASE=null;(function(){var u=window.LIFEOS_SUPABASE_URL||document.querySelector('meta[name="lifeos-supabase-url"]')?.content||'';var k=window.LIFEOS_SUPABASE_ANON_KEY||document.querySelector('meta[name="lifeos-supabase-key"]')?.content||'';if(!u||!k){console.log('LifeOS: offline mode (no Supabase env vars)');return}var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.crossOrigin='anonymous';s.onload=function(){try{window.__SUPABASE=window.supabase.createClient(u,k);window.__SUPABASE_READY=!0;console.log('LifeOS: Supabase sync enabled')}catch(e){console.log('LifeOS: Supabase init failed, offline fallback')}};s.onerror=function(){console.log('LifeOS: Supabase CDN load failed, offline fallback')};document.head.appendChild(s)})()</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#222;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:16px}
header{padding:20px 0 12px}
h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.streak{font-size:13px;color:#666;background:#eee;padding:4px 10px;border-radius:20px}
.date{font-size:13px;color:#888;margin-top:2px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;font-weight:600;margin-bottom:10px;color:#444}
.track-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}
.track-item:last-child{border-bottom:none}
.track-label{font-size:14px;font-weight:500}
.track-desc{font-size:11px;color:#999;margin-top:1px}
.btn-group{display:flex;gap:4px}
.btn{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:white;font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{background:#f0f0f0}
.btn.active{background:#22c55e;color:white;border-color:#22c55e}
.btn.active.bad{background:#ef4444;border-color:#ef4444}
.btn.active.mid{background:#f59e0b;border-color:#f59e0b}
.notes-area{width:100%;border:1px solid #eee;border-radius:10px;padding:10px;font-size:13px;resize:vertical;min-height:60px;font-family:inherit}
.notes-area:focus{outline:none;border-color:#22c55e}
.save-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#22c55e;color:white;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s}
.save-btn:hover{opacity:.9}
.save-btn:disabled{opacity:.4;cursor:default}
.history{margin-top:20px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px;color:#666}
.history-score{font-weight:600}
.day-good{color:#22c55e}
.day-ok{color:#f59e0b}
.day-bad{color:#ef4444}
.empty{text-align:center;padding:40px 0;color:#bbb;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>⟳ LifeOS <span class="streak" id="streak">🔥 0 days</span></h1>
    </div>
    <div class="date" id="date"></div>
  </header>

  <div class="card" id="trackers">
    <h2>How was today?</h2>
    <div id="tracker-list"></div>
  </div>

  <div class="card">
    <h2>Notes / Reflect</h2>
    <textarea class="notes-area" id="notes" placeholder="What went well? What to improve?" maxlength="1000"></textarea>
  </div>

  <button class="save-btn" id="saveBtn" disabled>Save Today</button>
  <button class="sync-btn" id="syncBtn" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:white;color:#666;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;transition:all .15s" onclick="syncAllHistory()">↻ Sync All History</button>
  <span id="syncStatus" style="display:block;text-align:center;font-size:11px;color:#999;margin-top:4px"></span>

  <div class="history" id="history">
    <h2 style="font-size:14px;font-weight:600;color:#444;margin-bottom:8px">Last 7 Days</h2>
    <div id="history-list"></div>
  </div>

  <div class="card" id="trends">
    <h2>📊 Trend (7-day avg)</h2>
    <div id="trends-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

<script>
// Trackers config
const TRACKERS = [
  {id:'sleep',label:'😴 Sleep',options:[{v:1,l:'<6h'},{v:2,l:'6-7h'},{v:3,l:'7-8h'},{v:4,l:'8+'}],def:2},
  {id:'mood',label:'😊 Mood',options:[{v:1,l:'Bad'},{v:2,l:'Meh'},{v:3,l:'Good'},{v:4,l:'Great'}],def:2},
  {id:'energy',label:'⚡ Energy',options:[{v:1,l:'Low'},{v:2,l:'OK'},{v:3,l:'High'},{v:4,l:'Max'}],def:2},
  {id:'exercise',label:'🏃 Exercise',options:[{v:0,l:'None'},{v:1,l:'Light'},{v:2,l:'Good'},{v:3,l:'Intense'}],def:0},
  {id:'food',label:'🥗 Nutrition',options:[{v:0,l:'Junk'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Perfect'}],def:1},
  {id:'focus',label:'🎯 Focus',options:[{v:0,l:'Scattered'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Deep'}],def:1},
  {id:'social',label:'🤝 Social',options:[{v:0,l:'Alone'},{v:1,l:'Minimal'},{v:2,l:'Connected'},{v:3,l:'Great'}],def:1},
  {id:'productivity',label:'💼 Productivity',options:[{v:0,l:'Wasted'},{v:1,l:'Low'},{v:2,l:'Focused'},{v:3,l:'Flow'}],def:1},
  {id:'learning',label:'📚 Learning',options:[{v:0,l:'None'},{v:1,l:'Light'},{v:2,l:'Read'},{v:3,l:'Studied'}],def:0},
  {id:'mindfulness',label:'🧘 Mindfulness',options:[{v:0,l:'None'},{v:1,l:'Brief'},{v:2,l:'Meditated'},{v:3,l:'Deep'}],def:0},
  {id:'finances',label:'💰 Finances',options:[{v:0,l:'Overspent'},{v:1,l:'OK'},{v:2,l:'Good'},{v:3,l:'Saved'}],def:1}
];

function getToday(){return new Date().toISOString().split('T')[0]}
function getDateStr(){const d=new Date();return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'})}
function loadData(){try{return JSON.parse(localStorage.getItem('lifeos')||'{}')}catch{return{}}}
function saveData(d){localStorage.setItem('lifeos',JSON.stringify(d));render()}
function getScore(e){if(!e)return 0;let t=0;TRACKERS.forEach(tk=>{const v=e[tk.id]||0;t+=v});return Math.round(t/TRACKERS.length*25)}

// ─── Supabase Sync Layer (optional) ─────────────────────────────────────

/** Wait for supabase client to be ready (poll up to 10s) */
function waitForSupabase(maxMs){
  if(maxMs===void 0)maxMs=10000;
  return new Promise(function(resolve){
    var waited=0;var step=100;
    function check(){
      if(window.__SUPABASE_READY&&window.__SUPABASE){return resolve(window.__SUPABASE)}
      waited+=step;if(waited>=maxMs){return resolve(null)}
      setTimeout(check,step)
    }
    if(window.__SUPABASE_READY&&window.__SUPABASE){return resolve(window.__SUPABASE)}
    setTimeout(check,step)
  })
}

/** Build a lifeos_plugins row from today's tracker data */
function buildSyncPayload(dateStr,entry){
  var state=JSON.parse(JSON.stringify(entry||{}));
  return{
    id:'daily-'+dateStr,
    user_id:'demo',
    category:'daily_tracker',
    name:dateStr,
    emoji:'📋',
    state:state,
    total_actions:1,
    overall_progress:getScore(entry),
    last_active_at:new Date().toISOString()
  };
}

/** Upsert today's entry to Supabase lifeos_plugins */
function syncToSupabase(dateStr,entry){
  if(!window.__SUPABASE_READY||!window.__SUPABASE){return}
  var payload=buildSyncPayload(dateStr,entry);
  window.__SUPABASE.from('lifeos_plugins').upsert(payload,{onConflict:'id'}).then(function(resp){
    if(resp.error){console.warn('LifeOS: Supabase sync failed',resp.error)}
  }).catch(function(){});
}

/** Try to load today's entry from Supabase and merge (localStorage wins) */
function tryLoadFromSupabase(dateStr){
  if(!window.__SUPABASE_READY||!window.__SUPABASE){return Promise.resolve(null)}
  return window.__SUPABASE.from('lifeos_plugins').select('state').eq('id','daily-'+dateStr).single().then(function(resp){
    if(resp.error||!resp.data||!resp.data.state){return null}
    return resp.data.state;
  }).catch(function(){return null})
}

function getStreak(data){
  const days=Object.keys(data.days||{}).sort().reverse();
  if(!days.length)return 0;
  let streak=0;
  const today=getToday();
  for(const d of days){
    if(d===today||streak>0||d===yesterday(today,streak)){
      streak++;
    }else if(streak===0)break;
  }
  return streak;
}
function yesterday(t,i){
  const d=new Date(t);d.setDate(d.getDate()-1-i);
  return d.toISOString().split('T')[0];
}

let currentValue={};
const today=getToday();
const data=loadData();
const todayEntry=data.days?.[today]||{};
TRACKERS.forEach(tk=>{currentValue[tk.id]=todayEntry[tk.id]!==undefined?todayEntry[tk.id]:tk.def});

// On load: try to merge today's remote state if no local data yet
waitForSupabase().then(function(sb){
  if(!sb)return;
  tryLoadFromSupabase(today).then(function(remoteState){
    if(!remoteState)return;
    var data=loadData();
    if(!data.days)data.days={};
    var local=data.days[today];
    var hasLocal=local&&Object.keys(local).length>0&&TRACKERS.some(function(tk){return local[tk.id]!==void 0});
    if(!hasLocal){
      var merged=Object.assign({},remoteState);
      TRACKERS.forEach(function(tk){
        if(merged[tk.id]===void 0||merged[tk.id]===null)merged[tk.id]=tk.def;
      });
      data.days[today]=merged;
      saveData(data);
    }
  })
});

/** Sync ALL tracked days to Supabase */
function syncAllHistory(){
  var btn=document.getElementById('syncBtn');
  var status=document.getElementById('syncStatus');
  btn.disabled=true;
  btn.textContent='↻ Syncing...';
  status.textContent='Connecting...';
  waitForSupabase().then(function(sb){
    if(!sb){
      status.textContent='⚠ No Supabase connection (configure env vars)';
      btn.disabled=false;
      btn.textContent='↻ Sync All History';
      return;
    }
    var data=loadData();
    var days=Object.keys(data.days||{});
    if(!days.length){
      status.textContent='No data to sync';
      btn.disabled=false;
      btn.textContent='↻ Sync All History';
      return;
    }
    var i=0;
    function syncNext(){
      if(i>=days.length){
        status.textContent='✓ Synced '+days.length+' day(s)';
        btn.disabled=false;
        btn.textContent='↻ Sync All History';
        return;
      }
      var d=days[i];
      var entry=data.days[d];
      var payload=buildSyncPayload(d,entry);
      sb.from('lifeos_plugins').upsert(payload,{onConflict:'id'}).then(function(resp){
        if(resp.error)console.warn('sync error',d,resp.error);
        i++;
        status.textContent='Syncing '+i+'/'+days.length+'...';
        syncNext();
      }).catch(function(){i++;syncNext()});
    }
    syncNext();
  });
}

function render(){
  const data=loadData();
  const todayEntry=data.days?.[today]||{};
  TRACKERS.forEach(tk=>{
    if(todayEntry[tk.id]!==undefined)currentValue[tk.id]=todayEntry[tk.id];
  });

  // Tracker buttons
  const list=document.getElementById('tracker-list');
  list.innerHTML='';
  TRACKERS.forEach(tk=>{
    const val=currentValue[tk.id]!==undefined?currentValue[tk.id]:tk.def;
    const div=document.createElement('div');div.className='track-item';
    const labelDiv=document.createElement('div');
    labelDiv.innerHTML=`<div class="track-label">${tk.label}</div>`;
    const btnDiv=document.createElement('div');btnDiv.className='btn-group';
    tk.options.forEach(o=>{
      const b=document.createElement('button');
      b.className='btn'+(o.v===val?' active':'');
      if(tk.id==='mood'&&o.v===1&&o.v===val)b.classList.add('bad');
      if(tk.id==='mood'&&o.v===2&&o.v===val)b.classList.add('mid');
      b.textContent=o.l;
      b.onclick=()=>{currentValue[tk.id]=o.v;render()};
      btnDiv.appendChild(b);
    });
    div.appendChild(labelDiv);div.appendChild(btnDiv);
    list.appendChild(div);
  });

  // Notes
  document.getElementById('notes').value=todayEntry.notes||'';

  // Streak
  document.getElementById('streak').textContent='🔥 '+getStreak(data)+' day'+(getStreak(data)!==1?'s':'');

  // Save button — check tracker + notes changes
  const savedNotes = todayEntry.notes || '';
  const currentNotes = document.getElementById('notes').value;
  const trackerChanged = TRACKERS.some(tk => (currentValue[tk.id] ?? tk.def) !== (todayEntry[tk.id] !== undefined ? todayEntry[tk.id] : tk.def));
  const notesChanged = currentNotes !== savedNotes;
  const canSave = trackerChanged || notesChanged;
  document.getElementById('saveBtn').disabled = !canSave;
  document.getElementById('saveBtn').textContent = canSave ? 'Save Today' : 'Saved ✓';

  // History
  const histList=document.getElementById('history-list');
  const days=Object.keys(data.days||{}).sort().reverse().slice(0,7);
  if(!days.length){histList.innerHTML='<div class="empty">No days tracked yet. Start today!</div>'}else{
  histList.innerHTML='';
  days.forEach(d=>{
    const e=data.days[d];const score=getScore(e);const date=new Date(d+'T12:00:00');
    const label=date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const cls=score>=80?'day-good':score>=50?'day-ok':'day-bad';
    const div=document.createElement('div');div.className='history-item';
    div.innerHTML=`<span>${label}</span><span class="history-score ${cls}">${score}%</span>`;
    histList.appendChild(div);
  });}

  // Trend: 7-day avg per tracker
  const trendList=document.getElementById('trends-list');
  const trendDays=Object.keys(data.days||{}).sort().reverse().slice(0,7);
  if(trendDays.length>0){
    trendList.innerHTML='';
    TRACKERS.forEach(tk=>{
      var vals=trendDays.map(function(d){return data.days[d][tk.id]}).filter(function(v){return v!==void 0&&v!==null});
      if(!vals.length)return;
      var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
      var max=tk.options.reduce(function(m,o){return o.v>m?o.v:m},0);
      var pct=avg>0?Math.round((avg/max)*100):0;
      var div=document.createElement('div');div.className='track-item';
      div.style.padding='4px 0';
      div.innerHTML='<span style="font-size:12px;width:120px;flex-shrink:0">'+tk.label+'</span><div style="flex:1;height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=75?'#22c55e':pct>=50?'#f59e0b':'#ef4444')+';border-radius:6px;transition:width .3s"></div></div><span style="font-size:11px;color:#888;width:30px;text-align:right">'+avg.toFixed(1)+'</span>';
      trendList.appendChild(div);
    });
  }else{
    trendList.innerHTML='<div class="empty">Track a few days to see trends</div>';
  }
}

document.getElementById('date').textContent=getDateStr();

document.getElementById('saveBtn').onclick=()=>{
  const data=loadData();
  if(!data.days)data.days={};
  var entry=Object.assign({},currentValue,{notes:document.getElementById('notes').value});
  data.days[today]=entry;
  saveData(data);
  syncToSupabase(today,entry);
  render();
};

document.getElementById('notes').oninput=()=>{
  const data=loadData();
  const todayEntry=data.days?.[today]||{};
  const hasChanges=document.getElementById('notes').value!==(todayEntry.notes||'');
  document.getElementById('saveBtn').disabled=!hasChanges;
};

render();
</script>
</body>
</html>
